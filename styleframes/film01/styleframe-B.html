<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Film 01 · Styleframe B</title>
<link rel="stylesheet" href="../../brand/actiqo-motion-tokens.css">
<style>
  html,body{margin:0;padding:0}
  body{width:1080px;height:1920px;overflow:hidden;background:var(--acti-app-canvas);
       font-family:var(--acti-font-ui);color:var(--acti-ink);-webkit-font-smoothing:antialiased;
       position:relative}
  .abs{position:absolute}
  .fa{display:block}
  /* Page title: ACTI_TYPE_ROLE.pageTitle, Fraunces 28/34 600 -0.5px, ×k=2.5 → 70/85 */
  .page-title{font-family:var(--acti-font-editorial);font-weight:600;font-size:76px;line-height:84px;
              letter-spacing:-1.4px;font-variation-settings:"opsz" 72, "SOFT" 0, "WONK" 0}
  .page-sub{font-size:34px;line-height:44px;font-weight:400;color:var(--acti-ink-2)}
  .hour{font-size:26px;font-weight:500;color:var(--acti-ink-3);text-align:right;width:92px;
        transform:translateY(-50%)}
  .hline{height:2px;background:var(--acti-hairline)}
  .hline.half{background:rgba(11,31,59,0.045)}
  /* Chip: ACTIQO Row / pill language (white surface, hairline, soft shadow, circular tint well) */
  .chip{display:flex;align-items:center;gap:18px;background:var(--acti-surface);
        border:2px solid var(--acti-hairline);border-radius:var(--acti-r-surface);
        box-shadow:var(--acti-shadow-surface);padding:16px 26px 16px 16px;white-space:nowrap}
  .well{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .chip .t{font-size:32px;line-height:38px;font-weight:600;letter-spacing:-0.3px;color:var(--acti-ink)}
  .chip .s{font-size:25px;line-height:31px;font-weight:500;color:var(--acti-ink-2)}
  .chip.green{background:var(--acti-green-surface);border-color:transparent;box-shadow:none}
  .chip.orange{background:var(--acti-orange-surface);border-color:transparent;box-shadow:none}
  .w-green{background:var(--acti-green-surface);color:var(--acti-green-ink)}
  .w-white-green{background:#fff;color:var(--acti-green-ink)}
  .w-white-orange{background:#fff;color:var(--acti-orange-ink)}
  .w-blue{background:var(--acti-blue-surface);color:var(--acti-blue-ink)}
  .w-neutral{background:var(--acti-ink-tint);color:var(--acti-ink)}
  .w-lilac{background:var(--acti-lilac-surface);color:var(--acti-lilac-ink)}
  svg.threads{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible;pointer-events:none}
  
  .hour-block{background:var(--acti-ink);color:#fff;border-radius:var(--acti-r-surface);
              box-shadow:var(--acti-shadow-overlay);padding:26px 30px;box-sizing:border-box}

</style></head>
<body>

  <div class="abs" style="left:84px;top:252px">
    <div class="page-title">Thursday</div>
    <div class="page-sub" style="margin-top:6px">Leo’s soccer practice</div>
  </div>

  
    <div class="abs hour" style="left:84px;top:470px">4 PM</div>
    <div class="abs hline" style="left:196px;width:884px;top:470px"></div>
    <div class="abs hline half" style="left:196px;width:884px;top:630px"></div>
  
    <div class="abs hour" style="left:84px;top:790px">5 PM</div>
    <div class="abs hline" style="left:196px;width:884px;top:790px"></div>
    <div class="abs hline half" style="left:196px;width:884px;top:950px"></div>
  
    <div class="abs hour" style="left:84px;top:1110px">6 PM</div>
    <div class="abs hline" style="left:196px;width:884px;top:1110px"></div>
    <div class="abs hline half" style="left:196px;width:884px;top:1270px"></div>
  
    <div class="abs hour" style="left:84px;top:1430px">7 PM</div>
    <div class="abs hline" style="left:196px;width:884px;top:1430px"></div>
    <div class="abs hline half" style="left:196px;width:884px;top:1590px"></div>
  

  <!-- Leave-by bracket: 4:48 → 5:30, attached to the event's left edge -->
  <div class="abs" style="left:192px;top:726px;width:6px;height:224px;
       background:var(--acti-green-ink);border-radius:3px"></div>
  <div class="abs" style="left:184px;top:723px;width:22px;height:6px;
       background:var(--acti-green-ink);border-radius:3px"></div>

  <!-- Leave-by card (Home Up Next leave row, scaled) -->
  <div class="abs chip green" id="leave" style="left:214px;top:668px;padding:18px 34px 18px 18px">
    <div class="well w-white-green" style="width:80px;height:80px"><svg class="fa" width="36" height="36" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path fill="currentColor" d="M147 170.7L117.2 256L240.1 256L240.1 160L162.2 160C155.4 160 149.3 164.3 147.1 170.7zM48.6 257.9L86.5 149.6C97.8 117.5 128.1 96 162.1 96L360 96C385.2 96 408.9 107.9 424 128L520.2 256.3C587.1 260.5 640 316.1 640 384L640 400C640 435.3 611.3 464 576 464L559.6 464C555.6 508.9 517.9 544 472 544C426.1 544 388.4 508.9 384.4 464L239.7 464C235.7 508.9 198 544 152.1 544C106.2 544 68.5 508.9 64.5 464L64.1 464C28.8 464 .1 435.3 .1 400L.1 320C.1 289.9 20.8 264.7 48.7 257.9zM440 256L372.8 166.4C369.8 162.4 365 160 360 160L288 160L288 256L440 256zM152 496C174.1 496 192 478.1 192 456C192 433.9 174.1 416 152 416C129.9 416 112 433.9 112 456C112 478.1 129.9 496 152 496zM512 456C512 433.9 494.1 416 472 416C449.9 416 432 433.9 432 456C432 478.1 449.9 496 472 496C494.1 496 512 478.1 512 456z"/></svg></div>
    <div>
      <div class="t" style="color:var(--acti-green-ink);font-weight:600;font-size:40px;line-height:46px">Leave by 4:48 PM</div>
      <div class="s">32 min drive + 10 min buffer</div>
    </div>
  </div>

  <!-- The Hour Block: navy = dominant object -->
  <div class="abs hour-block" style="left:214px;top:950px;width:334px;height:300px">
    <div style="display:flex;align-items:center;gap:16px">
      <div class="well" style="width:64px;height:64px;background:rgba(255,255,255,0.12);color:#fff"><svg class="fa" width="30" height="30" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path fill="currentColor" d="M481.3 424.1L409.7 419.3C404.5 419 399.4 420.4 395.2 423.5C391 426.6 388 430.9 386.8 436L369.2 505.6C353.5 509.8 337 512 320 512C303 512 286.5 509.8 270.8 505.6L253.2 436C251.9 431 248.9 426.6 244.8 423.5C240.7 420.4 235.5 419 230.3 419.3L158.7 424.1C141.1 396.9 130.2 364.9 128.3 330.5L189 292.3C193.4 289.5 196.6 285.3 198.2 280.4C199.8 275.5 199.6 270.2 197.7 265.4L171 198.8C192 173.2 219.3 153 250.7 140.9L305.9 186.9C309.9 190.2 314.9 192 320 192C325.1 192 330.2 190.2 334.1 186.9L389.3 140.9C420.6 153 448 173.2 468.9 198.8L442.2 265.4C440.3 270.2 440.1 275.5 441.7 280.4C443.3 285.3 446.6 289.5 450.9 292.3L511.6 330.5C509.7 364.9 498.8 396.9 481.2 424.1zM320 576C461.4 576 576 461.4 576 320C576 178.6 461.4 64 320 64C178.6 64 64 178.6 64 320C64 461.4 178.6 576 320 576zM334.1 250.3C325.7 244.2 314.3 244.2 305.9 250.3L258 285C249.6 291.1 246.1 301.9 249.3 311.8L267.6 368.1C270.8 378 280 384.7 290.4 384.7L349.6 384.7C360 384.7 369.2 378 372.4 368.1L390.7 311.8C393.9 301.9 390.4 291.1 382 285L334.1 250.2z"/></svg></div>
      <div style="font-size:26px;font-weight:600;color:rgba(255,255,255,0.72)">Leo</div>
    </div>
    <div style="font-size:48px;line-height:54px;font-weight:600;letter-spacing:-0.9px;margin-top:24px">Soccer<br>Practice</div>
    <div style="font-size:28px;line-height:36px;font-weight:500;color:rgba(255,255,255,0.72);margin-top:6px">5:30 – 6:30 PM</div>
  </div>

  <!-- Responsibility: drop-off -->
  <div class="abs chip" id="driving" style="left:560px;top:811.3333333333333px">
    <div class="well w-green" style="width:64px;height:64px"><svg class="fa" width="26" height="26" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path fill="currentColor" d="M320 312C386.3 312 440 258.3 440 192C440 125.7 386.3 72 320 72C253.7 72 200 125.7 200 192C200 258.3 253.7 312 320 312zM290.3 368C191.8 368 112 447.8 112 546.3C112 562.7 125.3 576 141.7 576L498.3 576C514.7 576 528 562.7 528 546.3C528 447.8 448.2 368 349.7 368L290.3 368z"/></svg></div>
    <div><div class="t">Dad driving</div><div class="s">Drop-off</div></div>
  </div>

  <!-- Preparation -->
  <div class="abs chip" id="bring" style="left:590px;top:1088.6666666666665px">
    <div class="well w-blue" style="width:64px;height:64px"><svg class="fa" width="26" height="26" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path fill="currentColor" d="M256 144C256 108.7 284.7 80 320 80C355.3 80 384 108.7 384 144L384 192L256 192L256 144zM208 192L144 192C117.5 192 96 213.5 96 240L96 448C96 501 139 544 192 544L448 544C501 544 544 501 544 448L544 240C544 213.5 522.5 192 496 192L432 192L432 144C432 82.1 381.9 32 320 32C258.1 32 208 82.1 208 144L208 192zM232 240C245.3 240 256 250.7 256 264C256 277.3 245.3 288 232 288C218.7 288 208 277.3 208 264C208 250.7 218.7 240 232 240zM384 264C384 250.7 394.7 240 408 240C421.3 240 432 250.7 432 264C432 277.3 421.3 288 408 288C394.7 288 384 277.3 384 264z"/></svg></div>
    <div><div class="t">What to bring</div><div class="s">Cleats, shin guards</div></div>
  </div>

  <!-- Unresolved pickup: the reason the question exists -->
  <div class="abs chip orange" id="pickup" style="left:214px;top:1318px;padding:18px 34px 18px 18px">
    <div class="well w-white-orange" style="width:80px;height:80px"><svg class="fa" width="34" height="34" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path fill="currentColor" d="M320 144C350.9 144 376 118.9 376 88C376 57.1 350.9 32 320 32C289.1 32 264 57.1 264 88C264 118.9 289.1 144 320 144zM233.4 291.9L256 269.3L256 338.6C256 366.6 268.2 393.3 289.5 411.5L360.9 472.7C366.8 477.8 370.7 484.8 371.8 492.5L384.4 580.6C386.9 598.1 403.1 610.3 420.6 607.8C438.1 605.3 450.3 589.1 447.8 571.6L435.2 483.5C431.9 460.4 420.3 439.4 402.6 424.2L368.1 394.6L368.1 279.4L371.9 284.1C390.1 306.9 417.7 320.1 446.9 320.1L480.1 320.1C497.8 320.1 512.1 305.8 512.1 288.1C512.1 270.4 497.8 256.1 480.1 256.1L446.9 256.1C437.2 256.1 428 251.7 421.9 244.1L404 221.7C381 192.9 346.1 176.1 309.2 176.1C277 176.1 246.1 188.9 223.4 211.7L188.1 246.6C170.1 264.6 160 289 160 314.5L160 352C160 369.7 174.3 384 192 384C209.7 384 224 369.7 224 352L224 314.5C224 306 227.4 297.9 233.4 291.9zM245.8 471.3C244.3 476.5 241.5 481.3 237.7 485.1L169.4 553.4C156.9 565.9 156.9 586.2 169.4 598.7C181.9 611.2 202.2 611.2 214.7 598.7L283 530.4C294.5 518.9 302.9 504.6 307.4 488.9L309.6 481.3L263.6 441.9C261.1 439.7 258.6 437.5 256.2 435.1L245.8 471.3z"/></svg></div>
    <div>
      <div class="t" style="font-size:38px;line-height:44px">Pickup · 6:30 PM</div>
      <div class="s" style="color:var(--acti-orange-ink);font-weight:600">No one assigned yet</div>
    </div>
  </div>

  <svg class="threads" id="threads"></svg>
  <script>
    // Threads: semantic origin (a time on the event) → destination (the chip that owns it).
    const T = document.getElementById('threads');
    const box = id => document.getElementById(id).getBoundingClientRect();
    const blk = { x:214, y:950, w:334, h:300 };
    function thread(x1,y1,x2,y2,{color='rgba(11,31,59,0.28)',dash=false,dot=true}={}){
      const mx=(x1+x2)/2;
      T.insertAdjacentHTML('beforeend',
        '<path d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linecap="round"'+(dash?' stroke-dasharray="2 11"':'')+'/>'+
        (dot?'<circle cx="'+x1+'" cy="'+y1+'" r="8" fill="'+color+'"/>':''));
    }
    const lv=box('leave'), dr=box('driving'), br=box('bring'), pk=box('pickup');
    // leave-by → who is driving (responsibility hangs off the leave time)
    T.insertAdjacentHTML('beforeend','<circle cx="'+(dr.left+48)+'" cy="'+lv.bottom+'" r="8" fill="rgba(11,31,59,0.28)"/><line x1="'+(dr.left+48)+'" y1="'+lv.bottom+'" x2="'+(dr.left+48)+'" y2="'+dr.top+'" stroke="rgba(11,31,59,0.28)" stroke-width="3"/>');
    // the event → what it needs packed
    thread(blk.x+blk.w, blk.y+blk.h*0.62, br.left, br.top+br.height/2);
    // 6:30 end of practice → unassigned pickup (dashed = unresolved)
    T.insertAdjacentHTML('beforeend','<line x1="'+(blk.x+56)+'" y1="'+(blk.y+blk.h)+'" x2="'+(blk.x+56)+'" y2="'+pk.top+'" stroke="#C2410C" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>');
  </script>

</body></html>
