# Packages the current motion REVIEW materials (contact sheets, keyframes, review previews, REVIEW.md)
# as a downloadable workflow artifact for remote review. Read-only: it renders nothing, installs
# nothing, and never modifies the repository.
name: Review artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'film01/**'
      - 'film02/**'
      # Film 01's review assets currently live at these paths (there is no film01/ folder yet)
      - 'styleframes/film01/**'
      - 'videos/actiqo-the-hour/stills/**'
      - 'videos/actiqo-the-hour/renders/**'

permissions:
  contents: read

concurrency:
  group: review-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-review:
    name: Package review artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out (with Git LFS, so MP4 previews are real files, not pointers)
        uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      - name: List review files being packaged
        run: |
          shopt -s globstar nullglob
          files=(
            film02/production/cp*/REVIEW.md
            film02/production/cp*/**/*.png
            film02/production/film/out/CP*_contact_*.png
            film02/production/film/out/stills/*.png
            film02/production/film/out/ACTIQO_*CP*.mp4
            film01/**/*.png film01/**/*.jpg film01/**/*.mp4 film01/**/*.md
            styleframes/film01/**/*.png styleframes/film01/**/*.jpg styleframes/film01/**/*.md
            videos/actiqo-the-hour/stills/**/*.png
            videos/actiqo-the-hour/renders/*.mp4
          )
          printf '%s\n' "${files[@]}" | sort -u | tee review-manifest.txt
          echo "files: $(sort -u review-manifest.txt | wc -l)"

      - name: Upload review artifact
        uses: actions/upload-artifact@v7
        with:
          name: actiqo-motion-review-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            review-manifest.txt
            film02/production/cp*/REVIEW.md
            film02/production/cp*/**/*.png
            film02/production/film/out/CP*_contact_*.png
            film02/production/film/out/stills/*.png
            film02/production/film/out/ACTIQO_*CP*.mp4
            film01/**/*.png
            film01/**/*.jpg
            film01/**/*.mp4
            film01/**/*.md
            styleframes/film01/**/*.png
            styleframes/film01/**/*.jpg
            styleframes/film01/**/*.md
            videos/actiqo-the-hour/stills/**/*.png
            videos/actiqo-the-hour/renders/*.mp4
            !**/node_modules/**
            !**/*.log
            !**/tmp/**
            !**/frames/**
            !**/.cache/**
