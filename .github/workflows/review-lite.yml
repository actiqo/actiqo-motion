# Lightweight review-only package (current set): D04 real ACTIQO product capture + stills/contact + layout tests + CAPTURE_RECORD.md + REVIEW.md. Manual trigger only. Read-only: renders nothing, installs nothing, modifies nothing.
name: Review lite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package lightweight review artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out (with Git LFS, so any media are real files)
        uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      - name: Verify files and list sizes
        run: |
          set -euo pipefail
          files=(
            gtm/d04-tasting-notes/ui/capture/d04_ui_flow_9x16.mp4
            gtm/d04-tasting-notes/ui/capture/d04_ui_flow_contact.png
            gtm/d04-tasting-notes/ui/capture/d04_gameplan_all_three.png
            gtm/d04-tasting-notes/ui/capture/d04_prep_list.png
            gtm/d04-tasting-notes/edit/layout_tests/d04_layout_A_full_app_right_zone.png
            gtm/d04-tasting-notes/edit/layout_tests/d04_layout_B_row_crop_lower_safe.png
            gtm/d04-tasting-notes/ui/CAPTURE_RECORD.md
            gtm/d04-tasting-notes/edit/REVIEW.md
          )
          for f in "${files[@]}"; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
            if head -c 100 "$f" | grep -q 'git-lfs.github.com/spec'; then echo "LFS pointer, not media: $f"; exit 1; fi
          done
          du -b "${files[@]}" | tee review-lite-manifest.txt
          echo "total bytes: $(du -cb "${files[@]}" | tail -1 | cut -f1)" | tee -a review-lite-manifest.txt

      - name: Upload review artifact
        uses: actions/upload-artifact@v7
        with:
          name: actiqo-review-lite-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            review-lite-manifest.txt
            gtm/d04-tasting-notes/ui/capture/d04_ui_flow_9x16.mp4
            gtm/d04-tasting-notes/ui/capture/d04_ui_flow_contact.png
            gtm/d04-tasting-notes/ui/capture/d04_gameplan_all_three.png
            gtm/d04-tasting-notes/ui/capture/d04_prep_list.png
            gtm/d04-tasting-notes/edit/layout_tests/d04_layout_A_full_app_right_zone.png
            gtm/d04-tasting-notes/edit/layout_tests/d04_layout_B_row_crop_lower_safe.png
            gtm/d04-tasting-notes/ui/CAPTURE_RECORD.md
            gtm/d04-tasting-notes/edit/REVIEW.md
