# Lightweight review-only package (current set): the three D02 FINAL full-sound masters (A primary, B, D). Manual trigger only. Read-only: renders nothing, installs nothing, modifies nothing.
name: Review lite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package lightweight review artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out (with Git LFS, so MP4s are real files)
        uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      - name: Verify files and list sizes
        run: |
          set -euo pipefail
          files=(
            gtm/d02-water-bottles/final/ACTIQO_D02_SixWaterBottles_9x16_d02_waterbottles.mp4
            gtm/d02-water-bottles/final/ACTIQO_D02_SixWaterBottles_9x16_d02_20minutes.mp4
            gtm/d02-water-bottles/final/ACTIQO_D02_SixWaterBottles_9x16_d02_ownsix.mp4
          )
          for f in "${files[@]}"; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
            if head -c 100 "$f" | grep -q 'git-lfs.github.com/spec'; then echo "LFS pointer, not media: $f"; exit 1; fi
          done
          du -b "${files[@]}" | tee review-lite-manifest.txt
          echo "total bytes: $(du -cb "${files[@]}" | tail -1 | cut -f1)" | tee -a review-lite-manifest.txt

      - name: Upload review artifact
        uses: actions/upload-artifact@v7
        with:
          name: actiqo-review-lite-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            review-lite-manifest.txt
            gtm/d02-water-bottles/final/ACTIQO_D02_SixWaterBottles_9x16_d02_waterbottles.mp4
            gtm/d02-water-bottles/final/ACTIQO_D02_SixWaterBottles_9x16_d02_20minutes.mp4
            gtm/d02-water-bottles/final/ACTIQO_D02_SixWaterBottles_9x16_d02_ownsix.mp4
