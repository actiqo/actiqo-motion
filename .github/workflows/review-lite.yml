# Lightweight review-only package (current set): D03 first complete cut v01 (full sound + music-free) + contact sheet + REVIEW.md + CAPTURE_RECORD.md. Manual trigger only. Read-only: renders nothing, installs nothing, modifies nothing.
name: Review lite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package lightweight review artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out (with Git LFS, so any media are real files)
        uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      - name: Verify files and list sizes
        run: |
          set -euo pipefail
          files=(
            gtm/d03-practice-starts-at-five/edit/review/ACTIQO_D03_PracticeStartsAtFive_9x16_d03_leave430_v01.mp4
            gtm/d03-practice-starts-at-five/edit/review/ACTIQO_D03_PracticeStartsAtFive_9x16_d03_leave430_v01_musicfree.mp4
            gtm/d03-practice-starts-at-five/edit/review/ACTIQO_D03_PracticeStartsAtFive_9x16_d03_leave430_v01_contact.png
            gtm/d03-practice-starts-at-five/edit/REVIEW.md
            gtm/d03-practice-starts-at-five/ui/CAPTURE_RECORD.md
          )
          for f in "${files[@]}"; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
            if head -c 100 "$f" | grep -q 'git-lfs.github.com/spec'; then echo "LFS pointer, not media: $f"; exit 1; fi
          done
          du -b "${files[@]}" | tee review-lite-manifest.txt
          echo "total bytes: $(du -cb "${files[@]}" | tail -1 | cut -f1)" | tee -a review-lite-manifest.txt

      - name: Upload review artifact
        uses: actions/upload-artifact@v7
        with:
          name: actiqo-review-lite-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            review-lite-manifest.txt
            gtm/d03-practice-starts-at-five/edit/review/ACTIQO_D03_PracticeStartsAtFive_9x16_d03_leave430_v01.mp4
            gtm/d03-practice-starts-at-five/edit/review/ACTIQO_D03_PracticeStartsAtFive_9x16_d03_leave430_v01_musicfree.mp4
            gtm/d03-practice-starts-at-five/edit/review/ACTIQO_D03_PracticeStartsAtFive_9x16_d03_leave430_v01_contact.png
            gtm/d03-practice-starts-at-five/edit/REVIEW.md
            gtm/d03-practice-starts-at-five/ui/CAPTURE_RECORD.md
