<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ACTIQO D01 Narrated v2</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      D01 NARRATED v2 (draft). v1 is untouched (../../final, ../../edit). Timing record: ../TIMELINE_V2.md.
      Picture only here (muted); sound is mixed by sound/mix_v2.sh and muxed onto this render.
      Sources (all locked/real; nothing generated or redrawn in this edit):
        Alex/Jordan Veo Fast v01 (locked) · REAL ACTIQO capture ui_flow_9x16.mp4 (main 66ccdf6, QA) · brand wordmark + Inter.
      UI = two continuous passes: contiguous source ranges, taps at 1×, only waiting compressed (data-playback-rate).
    -->
    <style>
      @font-face { font-family: 'Inter'; src: url('assets/Inter.ttf') format('truetype'); font-weight: 100 900; }
      :root { --acti-app-canvas: #FCFAF7; --acti-ink: #0B1F3B; --acti-ink-2: #3F4C63; --acti-ink-3: #7A869A; --acti-r-control: 25px; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; scrollbar-width: none; }
      ::-webkit-scrollbar { display: none; width: 0; height: 0; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      .frame { position: absolute; inset: 0; overflow: hidden; }
      .frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .push { position: absolute; inset: 0; }
      #endcard { position: absolute; inset: 0; background: var(--acti-app-canvas); }
      #endcard .ec { position: absolute; left: 200px; right: 200px; text-align: center; opacity: 0; font-family: 'Inter', system-ui, sans-serif; text-wrap: balance; }
      #ec-wordmark { position: absolute; left: 50%; top: 400px; width: 560px; transform: translateX(-50%); opacity: 0; }
      #ec-cta { top: 588px; font-weight: 650; font-size: 60px; line-height: 1.12; letter-spacing: -0.02em; color: var(--acti-ink); }
      #ec-offer { top: 770px; left: 300px; right: 300px; font-weight: 500; font-size: 32px; line-height: 1.32; color: var(--acti-ink-2); }
      #ec-url { top: 900px; left: 300px; right: 300px; font-weight: 500; font-size: 30px; letter-spacing: 0.01em; color: var(--acti-ink-3); }
      /* dialogue captions: as v02 (speaker-adjacent) */
      .cap { position: absolute; left: 120px; top: 600px; max-width: 340px; padding: 16px 26px 18px; border-radius: var(--acti-r-control);
        background: rgba(11,31,59,0.82); color: #fff; font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 46px; line-height: 1.18;
        letter-spacing: -0.015em; text-wrap: balance; opacity: 0; }
      /* narration captions: lower band, left-anchored inside every platform clear area (x 120–780 below y 840), clear of the key UI rows */
      .capn { position: absolute; left: 120px; top: 1110px; max-width: 600px; padding: 12px 22px 14px; border-radius: var(--acti-r-control);
        background: rgba(11,31,59,0.86); color: #fff; font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 38px; line-height: 1.18;
        letter-spacing: -0.01em; text-wrap: balance; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <!-- S1 Alex / S2 Jordan: unchanged from v1 -->
      <div class="frame"><video id="s1" class="clip" src="assets/s1_alex_fast_v01.mp4" data-start="0" data-duration="1.30" data-media-start="0" data-track-index="1" muted playsinline></video></div>
      <div class="frame"><video id="s2" class="clip" src="assets/s2_jordan_fast_v01.mp4" data-start="1.30" data-duration="1.50" data-media-start="0.25" data-track-index="1" muted playsinline></video></div>

      <!-- P1 (2.80–6.50): src 2.40 → 7.30 continuous. Game Plan "Pickup · needs someone" → Who's doing what → Assignments tab → Assign → editor -->
      <div class="frame"><div class="push" id="w-p1" data-layout-allow-overflow style="transform-origin:50% 38%">
        <video id="p1a" class="clip" src="assets/ui_flow_9x16.mp4" data-start="2.80" data-duration="2.00" data-media-start="2.40" data-track-index="1" muted playsinline></video>
        <video id="p1b" class="clip" src="assets/ui_flow_9x16.mp4" data-start="4.80" data-duration="1.20" data-media-start="4.40" data-playback-rate="2" data-track-index="1" muted playsinline></video>
        <video id="p1c" class="clip" src="assets/ui_flow_9x16.mp4" data-start="6.00" data-duration="0.50" data-media-start="6.80" data-track-index="1" muted playsinline></video>
      </div></div>

      <!-- P2 (6.50–10.00): src 7.30 → 13.86 continuous. Pickup row → "Who brings them home?" → Alex → Save assignments → Saving… -->
      <div class="frame"><div class="push" id="w-p2" data-layout-allow-overflow style="transform-origin:50% 30%">
        <video id="p2a" class="clip" src="assets/ui_flow_9x16.mp4" data-start="6.50" data-duration="0.64" data-media-start="7.30" data-playback-rate="2.5" data-track-index="1" muted playsinline></video>
        <video id="p2b" class="clip" src="assets/ui_flow_9x16.mp4" data-start="7.14" data-duration="0.70" data-media-start="8.90" data-track-index="1" muted playsinline></video>
        <video id="p2c" class="clip" src="assets/ui_flow_9x16.mp4" data-start="7.84" data-duration="0.70" data-media-start="9.60" data-playback-rate="3" data-track-index="1" muted playsinline></video>
        <video id="p2d" class="clip" src="assets/ui_flow_9x16.mp4" data-start="8.54" data-duration="0.70" data-media-start="11.70" data-track-index="1" muted playsinline></video>
        <video id="p2e" class="clip" src="assets/ui_flow_9x16.mp4" data-start="9.24" data-duration="0.35" data-media-start="12.40" data-playback-rate="3" data-track-index="1" muted playsinline></video>
        <video id="p2f" class="clip" src="assets/ui_flow_9x16.mp4" data-start="9.59" data-duration="0.41" data-media-start="13.45" data-track-index="1" muted playsinline></video>
      </div></div>

      <!-- R (10.00–12.45): resolved Game Plan "Pickup · Alex · Saved — Alex is picking up" / "Drop-off · You, Pickup · Alex" -->
      <div class="frame"><div class="push" id="w-r" data-layout-allow-overflow style="transform-origin:50% 35%">
        <video id="r" class="clip" src="assets/ui_flow_9x16.mp4" data-start="10.00" data-duration="2.45" data-media-start="18.85" data-track-index="1" muted playsinline></video>
      </div></div>

      <!-- End card (v02 hierarchy) -->
      <div id="endcard" class="clip" data-start="12.45" data-duration="2.55" data-track-index="2">
        <img id="ec-wordmark" src="assets/actiqo-wordmark.png" alt="ACTIQO" />
        <div id="ec-cta" class="ec">Try it with your next practice.</div>
        <div id="ec-offer" class="ec">Complimentary Family access during Early Access</div>
        <div id="ec-url" class="ec">getactiqo.com</div>
      </div>

      <!-- Captions: dialogue (unchanged) + narration phrases (N3 is shown by the end card itself, not duplicated) -->
      <div id="cap-alex" class="cap clip" data-start="0.10" data-duration="1.15" data-track-index="3">I thought you had pickup.</div>
      <div id="cap-jordan" class="cap clip" data-start="1.40" data-duration="1.30" data-track-index="3">I did drop-off.</div>
      <div id="capn-1" class="capn clip" data-start="2.85" data-duration="3.00" data-track-index="4">ACTIQO keeps pickup and drop-off with the activity,</div>
      <div id="capn-2" class="capn clip" data-start="6.55" data-duration="2.55" data-track-index="4">so everyone sees who’s handling what.</div>
      <div id="capn-3" class="capn clip" data-start="9.70" data-duration="2.60" data-track-index="4">No guessing. Everyone knows the plan.</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // gentle punch-ins only (≤1.05): the real UI is full-width, larger pushes crop labels
      tl.fromTo('#w-p1', { scale: 1.0 }, { scale: 1.05, duration: 3.70, ease: 'sine.inOut' }, 2.80);
      tl.fromTo('#w-p2', { scale: 1.04 }, { scale: 1.0, duration: 2.70, ease: 'sine.inOut' }, 6.50); // eases out before the Save button (bottom of frame)
      tl.fromTo('#w-r', { scale: 1.0 }, { scale: 1.05, duration: 2.45, ease: 'sine.out' }, 10.00);
      tl.to('#ec-wordmark', { opacity: 1, duration: 0.30, ease: 'power2.out' }, 12.45);
      tl.fromTo('#ec-cta', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 12.55);
      tl.to('#ec-offer', { opacity: 1, duration: 0.30, ease: 'power2.out' }, 12.85);
      tl.to('#ec-url', { opacity: 1, duration: 0.30, ease: 'power2.out' }, 12.95);
      const capIn = (sel, t0, t1) => { tl.fromTo(sel, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.12, ease: 'power2.out' }, t0); tl.to(sel, { opacity: 0, duration: 0.10, ease: 'power1.in' }, t1 - 0.10); };
      capIn('#cap-alex', 0.10, 1.25); capIn('#cap-jordan', 1.40, 2.70);
      capIn('#capn-1', 2.85, 5.85); capIn('#capn-2', 6.55, 9.10); capIn('#capn-3', 9.70, 12.30);
      window.__timelines = window.__timelines || {}; window.__timelines['main'] = tl;
    </script>
  </body>
</html>
