<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ACTIQO D01 "Pickup was handled." picture-lock candidate v02</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      D01 rough/picture-lock candidate v02. Exact shot/audio points: TIMELINE.md (keep both in sync).
      Sources (all locked, nothing generated or redrawn here):
        S1  generations/review/s1/d01_s1_alex_fast_v01.mp4   (Veo 3.1 Fast, req 01a1faa8)
        S2  generations/review/s2/d01_s2_jordan_fast_v01.mp4 (Veo 3.1 Fast, req 01a1fb66)
        S3–S7  ui/capture/d01_ui_flow_9x16.mp4  (REAL ACTIQO main 66ccdf6, QA preview capture)
        S8  brand wordmark (raster, flat teal Q) + Inter, colours from brand/actiqo-motion-tokens.css
      v02: dialogue captions + CTA end card; still no music, SFX, VO or grade.
    -->
    <style>
      @font-face { font-family: 'Inter'; src: url('assets/Inter.ttf') format('truetype'); font-weight: 100 900; }
      :root {
        --acti-app-canvas: #FCFAF7; /* brand/actiqo-motion-tokens.css */
        --acti-ink: #0B1F3B;
        --acti-ink-2: #3F4C63;
        --acti-ink-3: #7A869A;
        --acti-r-control: 25px; /* 10px × k(2.5) */
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; scrollbar-width: none; }
      ::-webkit-scrollbar { display: none; width: 0; height: 0; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      .frame { position: absolute; inset: 0; overflow: hidden; }
      .frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .push { position: absolute; inset: 0; transform-origin: 50% 40%; }
      #endcard { position: absolute; inset: 0; background: var(--acti-app-canvas); }
      /* End card: inside TikTok (y240–840 x120–960; y840–1260 x120–780), Shorts (y288–1248 x48–888), Reels (y269–1248 x65–1015) */
      #endcard .ec { position: absolute; left: 200px; right: 200px; text-align: center; opacity: 0;
        font-family: 'Inter', system-ui, sans-serif; text-wrap: balance; }
      #ec-wordmark { position: absolute; left: 50%; top: 400px; width: 560px; transform: translateX(-50%); opacity: 0; }
      #ec-cta { top: 588px; font-weight: 650; font-size: 60px; line-height: 1.12; letter-spacing: -0.02em; color: var(--acti-ink); }
      #ec-offer { top: 770px; left: 300px; right: 300px; font-weight: 500; font-size: 32px; line-height: 1.32; color: var(--acti-ink-2); }
      #ec-url { top: 900px; left: 300px; right: 300px; font-weight: 500; font-size: 30px; letter-spacing: 0.01em; color: var(--acti-ink-3); }
      /* Dialogue captions: speaker-adjacent, left of the face, over background only; ACTIQO ink + Inter */
      .cap { position: absolute; left: 120px; top: 600px; max-width: 340px; padding: 16px 26px 18px;
        border-radius: var(--acti-r-control); background: rgba(11,31,59,0.82); color: #FFFFFF;
        font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 46px; line-height: 1.18;
        letter-spacing: -0.015em; text-wrap: balance; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">

      <!-- S1 · Alex · "I thought you had pickup." -->
      <div class="frame"><video id="s1" class="clip" src="assets/s1_alex_fast_v01.mp4"
        data-start="0" data-duration="1.30" data-media-start="0" data-track-index="1" muted playsinline></video></div>

      <!-- S2 · Jordan · "I did drop-off." -->
      <div class="frame"><video id="s2" class="clip" src="assets/s2_jordan_fast_v01.mp4"
        data-start="1.30" data-duration="1.50" data-media-start="0.25" data-track-index="1" muted playsinline></video></div>

      <!-- S3 · Real Game Plan: "Pickup · needs someone" (subtle push) -->
      <div class="frame"><div class="push" id="push-s3" data-layout-allow-overflow><video id="s3" class="clip" src="assets/ui_flow_9x16.mp4"
        data-start="2.80" data-duration="1.80" data-media-start="2.20" data-track-index="1" muted playsinline></video></div></div>

      <!-- S4 · Real Assignments tab → Assign → editor -->
      <div class="frame"><video id="s4" class="clip" src="assets/ui_flow_9x16.mp4"
        data-start="4.60" data-duration="2.20" data-media-start="5.50" data-track-index="1" muted playsinline></video></div>

      <!-- S5 · Real picker "Who brings them home?" → Alex -->
      <div class="frame"><video id="s5" class="clip" src="assets/ui_flow_9x16.mp4"
        data-start="6.80" data-duration="2.10" data-media-start="10.20" data-track-index="1" muted playsinline></video></div>

      <!-- S6 · Real "Save assignments" tap → Saving… (0.80 s; Saving… from src 13.70) -->
      <div class="frame"><video id="s6" class="clip" src="assets/ui_flow_9x16.mp4"
        data-start="8.90" data-duration="0.80" data-media-start="13.35" data-track-index="1" muted playsinline></video></div>

      <!-- S7 · Real saved state: "Pickup · Alex · Saved" / "Drop-off · You, Pickup · Alex" (subtle push) -->
      <div class="frame"><div class="push" id="push-s7" data-layout-allow-overflow><video id="s7" class="clip" src="assets/ui_flow_9x16.mp4"
        data-start="9.70" data-duration="2.50" data-media-start="20.00" data-track-index="1" muted playsinline></video></div></div>

      <!-- S8 · End card: wordmark + CTA (primary), offer (secondary), URL (discreet) -->
      <div id="endcard" class="clip" data-start="12.20" data-duration="2.80" data-track-index="2">
        <img id="ec-wordmark" src="assets/actiqo-wordmark.png" alt="ACTIQO" />
        <div id="ec-cta" class="ec">Try it with your next practice.</div>
        <div id="ec-offer" class="ec">Complimentary Family access during Early Access</div>
        <div id="ec-url" class="ec">getactiqo.com</div>
      </div>

      <!-- Dialogue captions (scripted lines only; off before the shot ends) -->
      <div id="cap-alex" class="cap clip" data-start="0.10" data-duration="1.15" data-track-index="3">I thought you had pickup.</div>
      <div id="cap-jordan" class="cap clip" data-start="1.40" data-duration="1.30" data-track-index="3">I did drop-off.</div>

      <!-- Native dialogue only (cut on word boundaries, 60 ms fade-outs to drop unscripted speech) -->
      <audio id="a1" src="assets/s1_alex_fast_v01.mp4" data-start="0" data-duration="1.26" data-media-start="0"
        data-track-index="10" data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1},{"t":1.20,"v":1},{"t":1.26,"v":0}]}]}'></audio>
      <audio id="a2" src="assets/s2_jordan_fast_v01.mp4" data-start="1.30" data-duration="1.43" data-media-start="0.25"
        data-track-index="11" data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1},{"t":1.37,"v":1},{"t":1.43,"v":0}]}]}'></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#push-s3', { scale: 1.0 }, { scale: 1.05, duration: 1.80, ease: 'none' }, 2.80);
      tl.fromTo('#push-s7', { scale: 1.0 }, { scale: 1.03, duration: 2.50, ease: 'none' }, 9.70);
      tl.to('#ec-wordmark', { opacity: 1, duration: 0.30, ease: 'power2.out' }, 12.20);
      tl.fromTo('#ec-cta', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 12.35);
      tl.to('#ec-offer', { opacity: 1, duration: 0.30, ease: 'power2.out' }, 12.65);
      tl.to('#ec-url', { opacity: 1, duration: 0.30, ease: 'power2.out' }, 12.75);
      // captions: quick in, out before the cut
      tl.fromTo('#cap-alex', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.12, ease: 'power2.out' }, 0.10);
      tl.to('#cap-alex', { opacity: 0, duration: 0.10, ease: 'power1.in' }, 1.15);
      tl.fromTo('#cap-jordan', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.12, ease: 'power2.out' }, 1.40);
      tl.to('#cap-jordan', { opacity: 0, duration: 0.10, ease: 'power1.in' }, 2.60);
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
