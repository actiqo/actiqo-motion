<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ACTIQO D01 "Pickup was handled." rough cut v01</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      D01 rough cut v01. Exact shot/audio points: TIMELINE.md (keep both in sync).
      Sources (all locked, nothing generated or redrawn here):
        S1  generations/review/s1/d01_s1_alex_fast_v01.mp4   (Veo 3.1 Fast, req 01a1faa8)
        S2  generations/review/s2/d01_s2_jordan_fast_v01.mp4 (Veo 3.1 Fast, req 01a1fb66)
        S3–S7  ui/capture/d01_ui_flow_9x16.mp4  (REAL ACTIQO main 66ccdf6, QA preview capture)
        S8  brand wordmark (raster, flat teal Q) + Inter, colours from brand/actiqo-motion-tokens.css
      Rough cut only: no music, SFX, captions, VO or grade.
    -->
    <style>
      @font-face { font-family: 'Inter'; src: url('assets/Inter.ttf') format('truetype'); font-weight: 100 900; }
      :root {
        --acti-app-canvas: #FCFAF7; /* brand/actiqo-motion-tokens.css */
        --acti-ink: #0B1F3B;
        --acti-ink-2: #3F4C63;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; scrollbar-width: none; }
      ::-webkit-scrollbar { display: none; width: 0; height: 0; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      .frame { position: absolute; inset: 0; overflow: hidden; }
      .frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .push { position: absolute; inset: 0; transform-origin: 50% 40%; }
      #endcard { position: absolute; inset: 0; background: var(--acti-app-canvas); }
      #ec-wordmark { position: absolute; left: 50%; top: 520px; width: 620px; transform: translateX(-50%); opacity: 0; }
      #ec-line {
        position: absolute; left: 160px; right: 160px; top: 712px; text-align: center; opacity: 0;
        font-family: 'Inter', system-ui, sans-serif; font-weight: 500; font-size: 46px; line-height: 1.3;
        letter-spacing: -0.01em; color: var(--acti-ink-2); text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">

      <!-- S1 · Alex · "I thought you had pickup." -->
      <div class="frame"><video id="s1" class="clip" src="assets/s1_alex_fast_v01.mp4"
        data-start="0" data-duration="1.30" data-media-start="0" data-track-index="1" muted playsinline></video></div>

      <!-- S2 · Jordan · "I did drop-off." -->
      <div class="frame"><video id="s2" class="clip" src="assets/s2_jordan_fast_v01.mp4"
        data-start="1.30" data-duration="1.50" data-media-start="0.25" data-track-index="1" muted playsinline></video></div>

      <!-- S3 · Real Game Plan: "Pickup · needs someone" (subtle push) -->
      <div class="frame"><div class="push" id="push-s3" data-layout-allow-overflow><video id="s3" class="clip" src="assets/ui_flow_9x16.mp4"
        data-start="2.80" data-duration="1.80" data-media-start="2.20" data-track-index="1" muted playsinline></video></div></div>

      <!-- S4 · Real Assignments tab → Assign → editor -->
      <div class="frame"><video id="s4" class="clip" src="assets/ui_flow_9x16.mp4"
        data-start="4.60" data-duration="2.20" data-media-start="5.50" data-track-index="1" muted playsinline></video></div>

      <!-- S5 · Real picker "Who brings them home?" → Alex -->
      <div class="frame"><video id="s5" class="clip" src="assets/ui_flow_9x16.mp4"
        data-start="6.80" data-duration="2.10" data-media-start="10.20" data-track-index="1" muted playsinline></video></div>

      <!-- S6 · Real "Save assignments" tap → Saving… -->
      <div class="frame"><video id="s6" class="clip" src="assets/ui_flow_9x16.mp4"
        data-start="8.90" data-duration="1.90" data-media-start="12.40" data-track-index="1" muted playsinline></video></div>

      <!-- S7 · Real saved state: "Pickup · Alex · Saved" / "Drop-off · You, Pickup · Alex" (subtle push) -->
      <div class="frame"><div class="push" id="push-s7" data-layout-allow-overflow><video id="s7" class="clip" src="assets/ui_flow_9x16.mp4"
        data-start="10.80" data-duration="2.00" data-media-start="20.00" data-track-index="1" muted playsinline></video></div></div>

      <!-- S8 · End card (line on screen ≥2 s; inside TikTok/Reels right-rail safe zone) -->
      <div id="endcard" class="clip" data-start="12.80" data-duration="2.20" data-track-index="2">
        <img id="ec-wordmark" src="assets/actiqo-wordmark.png" alt="ACTIQO" />
        <div id="ec-line">Complimentary Family access during Early Access</div>
      </div>

      <!-- Native dialogue only (cut on word boundaries, 60 ms fade-outs to drop unscripted speech) -->
      <audio id="a1" src="assets/s1_alex_fast_v01.mp4" data-start="0" data-duration="1.26" data-media-start="0"
        data-track-index="10" data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1},{"t":1.20,"v":1},{"t":1.26,"v":0}]}]}'></audio>
      <audio id="a2" src="assets/s2_jordan_fast_v01.mp4" data-start="1.30" data-duration="1.43" data-media-start="0.25"
        data-track-index="11" data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1},{"t":1.37,"v":1},{"t":1.43,"v":0}]}]}'></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#push-s3', { scale: 1.0 }, { scale: 1.05, duration: 1.80, ease: 'none' }, 2.80);
      tl.fromTo('#push-s7', { scale: 1.0 }, { scale: 1.03, duration: 2.00, ease: 'none' }, 10.80);
      tl.to('#ec-wordmark', { opacity: 1, duration: 0.30, ease: 'power2.out' }, 12.80);
      tl.to('#ec-line', { opacity: 1, duration: 0.30, ease: 'power2.out' }, 12.90);
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
